<!DOCTYPE html>
<html manifest="900.manifest">
<head>
<title>بشير لصيانة الاجهزة الالكترونية</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML=":التخزين المؤقت " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="✔تم تثبيت ذاكرة التخزين المؤقت بنجاح ";setTimeout(function(){window.msgs.innerHTML="...أغلق متصفحك ثم أعد فتحه ";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="...حدث خطأ أثناء تثبيت ذاكرة التخزين المؤقت! - امسح ذاكرة التخزين المؤقت وأعد فتح المتصفح ";};
</script>
<h1>PS4 9.00 - 13.00</h1>
